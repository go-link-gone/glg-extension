<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoLinkGone</title>
    <link rel="stylesheet" href="popup.css" />
</head>

<body>
    <main class="popup-shell">
        <header class="popup-header">
            <img class="brand-mark" src="icons/icon.png" alt="GoLinkGone logo" />
            <div>
                <p class="eyebrow">GoLinkGone</p>
                <h1>Shorten this page</h1>
            </div>
        </header>

        <section class="panel">
            <div id="state-initial" class="state-block">
                <p class="panel-label">Current Tab URL</p>
                <input id="tab-url" class="url-input" type="text" readonly value="Loading current tab..." />
                <button id="generate-btn" class="primary-button" type="button" disabled>Generate</button>
            </div>

            <div id="state-loading" class="state-block hidden" aria-live="polite">
                <p class="panel-label">Generating</p>
                <div class="loading-row">
                    <span class="spinner" aria-hidden="true"></span>
                    <p class="panel-text">Generating...</p>
                </div>
            </div>

            <div id="state-result" class="state-block hidden">
                <p class="panel-label">Result Preview</p>
                <div class="result-url-row">
                    <p class="panel-text" id="result-text">Short URL will appear here.</p>
                    <button id="copy-btn" class="secondary-button copy-button" type="button" disabled>Copy</button>
                </div>
                <div id="qr-wrap" class="qr-wrap hidden">
                    <img id="qr-image" class="qr-image" alt="QR code for short URL" />
                </div>
                <button id="download-btn" class="secondary-button hidden" type="button" disabled>Download QR</button>
                <button id="back-btn" class="secondary-button" type="button">Back</button>
            </div>
        </section>
    </main>

    <script src="popup.js"></script>
</body>

</html>
