<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoLinkGone</title>
    <link rel="stylesheet" href="popup.css" />
</head>

<body>
    <main class="popup-shell">
        <header class="popup-header">
            <div class="brand-mark" aria-hidden="true">GLG</div>
            <div>
                <p class="eyebrow">GoLinkGone</p>
                <h1>Shorten this page</h1>
            </div>
        </header>

        <section class="panel">
            <p class="panel-label">Current Tab URL</p>
            <input id="tab-url" class="url-input" type="text" readonly value="Loading current tab..." />
            <button id="generate-btn" class="primary-button" type="button" disabled>Generate</button>
        </section>
    </main>

    <script src="popup.js"></script>
</body>

</html>
